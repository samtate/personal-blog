name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_HOST_ED25519_SHA256: SHA256:CPpDJF7szLXVJJ15Qzakr0llRD8HBcGoHFqlzPti9Qg
      DEPLOY_KEY_ED25519_SHA256: SHA256:QxkinsBKeKUhMUhwJ7xhR4jmX45WRh7m7H6phcQmRfo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.70.142.113

      - name: Validate deployment target
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test "$DEPLOY_PATH" = "/volume1/docker-nfs/samtatemeuk/site"

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          key_fingerprint="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | ssh-keygen -lf - -E sha256 | awk '{print $2; exit}')"
          test "$key_fingerprint" = "$DEPLOY_KEY_ED25519_SHA256"
          scan_path="$(mktemp)"
          trap 'rm -f "$scan_path"' EXIT
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > "$scan_path" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$scan_path" -E sha256 | awk '{print $2; exit}')"
          test "$actual_fingerprint" = "$DEPLOY_HOST_ED25519_SHA256"
          install -m 600 "$scan_path" ~/.ssh/known_hosts

      - name: Deploy generated files
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          printf -v target_path '%q' "$DEPLOY_PATH"
          remote_command="$(printf '%s\n' \
            'set -eu' \
            "target=$target_path" \
            'stage=/tmp/personal-blog-deploy' \
            'rm -rf -- "$stage"' \
            'mkdir -p -- "$stage" "$target"' \
            'tar -xzf - -C "$stage"' \
            'find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} \;' \
            'cp -a "$stage"/. "$target"/' \
            'rm -rf -- "$stage"')"
          tar -C dist -czf - . | ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -p "$port" \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
